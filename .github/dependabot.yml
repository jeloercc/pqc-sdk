# Dependabot version updates for GitHub Actions and the pnpm workspace.
# docs/security/SCORECARD-REVIEW-2026-11.md, SC-L3 (decision D2).
#
# Groups apply to version updates only (no `applies-to`), so a security
# update still arrives as its own pull request. Majors are left out of every
# group so a breaking release arrives in its own pull request instead of
# holding back the rest.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    ignore:
      # changesets/action v2 requires @changesets/cli v3 and renames its
      # inputs/outputs; PR CI does not run the release job, so a green
      # Dependabot PR would still break publishing (#130). Migrate the action
      # and the CLI together, by hand. `ignore` also applies to security
      # updates for that major.
      - dependency-name: changesets/action
        update-types: ['version-update:semver-major']
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]

  # The root pnpm-lock.yaml covers every workspace package, examples included.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    exclude-paths:
      # Pinned on purpose to Expo SDK 54 / RN 0.81, the combination validated
      # on a physical device (docs/compatibility.md, "React Native app"): the
      # test device's Expo Go only supports SDK 54. #132/#133 moved it to
      # Expo 58 / RN 0.88 and were reverted. Version updates only; security
      # updates still apply.
      - 'examples/react-native-expo/**'
    ignore:
      # vitest 5 needs Node >= 22.12; engines (>=20) and CI stay on Node 20
      # (SCORECARD-REVIEW-2026-11, decision D1). `ignore` also applies to
      # security updates, so a fix released only in a new vitest major would
      # not arrive as a pull request.
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']
    groups:
      # The cryptographic primitives are pinned to exact versions and bumped
      # deliberately behind the NIST vector tests (SECURITY.md, "Dependency
      # policy"): they get a pull request of their own, never mixed with
      # other updates, and nothing changes until a maintainer merges it.
      noble:
        patterns: ['@noble/*']
      # The other groups exclude @noble/* explicitly. Listing `noble` first
      # was not enough: the first run (2026-11-03) put @noble/ciphers into
      # npm-production (#132).
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: ['@noble/*']
      npm-production:
        dependency-type: production
        update-types: [minor, patch]
        exclude-patterns: ['@noble/*']
