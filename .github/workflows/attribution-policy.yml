name: Owner attribution policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: owner-attribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evaluate-owner-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # Only trusted default-branch code runs with the status-writing token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Evaluate metadata and report the PR head status
        run: node scripts/check-contributor-policy.mjs --pull-request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
