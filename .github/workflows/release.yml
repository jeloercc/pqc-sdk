name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the version PR, tags and releases
      pull-requests: write
      id-token: write # OIDC: npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1: `pnpm publish` packs and
      # then runs the `npm` on PATH. Node 24.5.0 and later bundle npm >= 11.5.1,
      # so nothing is installed here: an `npm install` would be an unpinned
      # download in the job that can publish (SCORECARD-REVIEW-2026-11, SC-M2).
      # This step only fails the job early if the bundled npm is ever older.
      - name: Check npm for trusted publishing
        run: |
          npm_version="$(npm --version)"
          echo "npm ${npm_version}"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map((n) => parseInt(n, 10));
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) {
              console.error(`npm ${process.argv[1]} is older than 11.5.1, which trusted publishing needs`);
              process.exit(1);
            }
          ' "${npm_version}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR or publish to npm
        id: changesets
        # v1 is a branch upstream, not a tag; this is the commit it pointed to.
        # Stay on v1 while the repo uses @changesets/cli 2: action v2 requires
        # CLI v3 and renames these inputs and outputs (publish-script,
        # published-packages, ...). v2.1.2 failed every Release run after #130.
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # One CycloneDX SBOM per package published in this run, attached to that
      # package's GitHub release (<name>@<version>). See scripts/release-sbom.mjs.
      - name: Attach SBOMs to the GitHub releases
        if: steps.changesets.outputs.published == 'true'
        run: node scripts/release-sbom.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
