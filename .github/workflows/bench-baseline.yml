name: Bench baseline

# Regenerates the committed benchmark baseline ON THE CI RUNNER and uploads it
# as an artifact. Download it and commit it in the PR that legitimately shifted
# performance — see packages/core/bench/README.md for the full procedure.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run benchmarks
        run: pnpm --filter @pqc-sdk/core bench

      - name: Snapshot baseline
        working-directory: packages/core
        run: node bench/bench-gate.mjs snapshot --results bench/results.json --out bench/baseline.json

      - name: Upload baseline artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-baseline
          path: packages/core/bench/baseline.json
          if-no-files-found: error
