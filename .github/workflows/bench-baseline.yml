name: Bench baseline

# Regenerates the committed benchmark baseline ON THE CI RUNNER and uploads it
# as an artifact. Download it and commit it in the PR that legitimately shifted
# performance — see packages/core/bench/README.md for the full procedure.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run benchmarks
        run: pnpm --filter @pqc-sdk/core bench

      - name: Snapshot baseline
        working-directory: packages/core
        run: node bench/bench-gate.mjs snapshot --results bench/results.json --out bench/baseline.json

      - name: Upload baseline artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-baseline
          path: packages/core/bench/baseline.json
          if-no-files-found: error
